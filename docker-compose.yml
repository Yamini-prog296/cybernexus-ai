version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybernexus_backend
    environment:
      - AI_PROVIDER=local
      - DATABASE_URL=sqlite:///./cybernexus.db
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybernexus_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
